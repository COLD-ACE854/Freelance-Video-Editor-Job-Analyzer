<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Video Job Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ============================= DESIGN TOKENS ============================= */
  :root {
    --bg: #fcfcfa;
    --surface: #ffffff;
    --surface-2: #f4f3ef;
    --border: #e4e2dd;
    --ink: #15171c;
    --ink-muted: #6b6f76;
    --accent: #2a4fe0;
    --accent-strong: #1b3bc4;
    --accent-ink: #ffffff;
    --accent-soft: #ebeffd;

    --track-editing: #2a4fe0;
    --track-revisions: #7c5cff;
    --track-communication: #17b0a7;
    --track-hidden: #ff8a3d;

    --risk-low: #1c8a5e;
    --risk-low-bg: #e7f5ee;
    --risk-medium: #a86a0a;
    --risk-medium-bg: #fbf1dd;
    --risk-high: #c7402f;
    --risk-high-bg: #fbeae7;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 22px;

    --font-display: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-body: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101218;
      --surface: #171a21;
      --surface-2: #1d212b;
      --border: #2b2f3a;
      --ink: #f1f2f4;
      --ink-muted: #9aa0ac;
      --accent: #7691ff;
      --accent-strong: #94a9ff;
      --accent-ink: #0f1115;
      --accent-soft: #202748;
      --risk-low: #43d38f;
      --risk-low-bg: #103427;
      --risk-medium: #f0b429;
      --risk-medium-bg: #372a10;
      --risk-high: #ff7a68;
      --risk-high-bg: #3a1a15;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101218;
    --surface: #171a21;
    --surface-2: #1d212b;
    --border: #2b2f3a;
    --ink: #f1f2f4;
    --ink-muted: #9aa0ac;
    --accent: #7691ff;
    --accent-strong: #94a9ff;
    --accent-ink: #0f1115;
    --accent-soft: #202748;
    --risk-low: #43d38f;
    --risk-low-bg: #103427;
    --risk-medium: #f0b429;
    --risk-medium-bg: #372a10;
    --risk-high: #ff7a68;
    --risk-high-bg: #3a1a15;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  button { font-family: var(--font-body); cursor: pointer; }
  input, select, textarea { font-family: var(--font-body); font-size: 15px; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .shell { max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- topbar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 880px; margin: 0 auto; padding: 18px 20px 0;
  }
  .wordmark { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
  .wordmark .dot { color: var(--accent); }
  .tag {
    font-size: 12px; color: var(--ink-muted); border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 100px;
  }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: var(--radius-sm); border: 1px solid transparent;
    padding: 11px 20px; font-size: 15px; font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink-muted); border-color: transparent; }
  .btn-ghost:hover { color: var(--ink); }
  .btn-lg { padding: 14px 26px; font-size: 16px; width: 100%; }
  .link-btn {
    background: none; border: none; padding: 0; color: var(--accent);
    font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px;
  }
  .back-link {
    background: none; border: none; color: var(--ink-muted); font-size: 14px;
    padding: 6px 0; margin-bottom: 18px; display: inline-block;
  }
  .back-link:hover { color: var(--ink); }

  /* ---------- hero ---------- */
  .hero {
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 44px; align-items: center;
    padding: 44px 0 56px;
  }
  .hero h1 {
    font-size: clamp(30px, 4.6vw, 46px); letter-spacing: -0.01em; max-width: 15ch;
  }
  .hero-sub { margin-top: 18px; font-size: 17px; color: var(--ink-muted); max-width: 44ch; }
  .hero-actions { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }

  .timeline-demo {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 22px;
  }
  .timeline-demo-label { font-size: 13px; color: var(--ink-muted); margin-bottom: 14px; }
  .timeline-track {
    display: flex; width: 100%; height: 40px; border-radius: 10px; overflow: hidden;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .timeline-track.big { height: 52px; }
  .seg {
    width: 0%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden;
    transition: width 1.1s cubic-bezier(.2,.7,.2,1);
  }
  .seg-editing { background: var(--track-editing); }
  .seg-revisions { background: var(--track-revisions); }
  .seg-communication { background: var(--track-communication); }
  .seg-hidden { background: var(--track-hidden); }
  .timeline-demo-caption { margin-top: 12px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted); }
  .timeline-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 13px; color: var(--ink-muted); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  /* ---------- how it works ---------- */
  .how-it-works { padding: 10px 0 50px; border-top: 1px solid var(--border); }
  .how-it-works h2 { font-size: 22px; margin-top: 46px; margin-bottom: 26px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .steps li { display: flex; flex-direction: column; gap: 8px; }
  .step-num {
    font-family: var(--font-mono); font-size: 13px; color: var(--accent);
    border: 1px solid var(--border); width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
  }
  .steps h3 { font-size: 16px; }
  .steps p { color: var(--ink-muted); font-size: 14.5px; }

  /* ---------- panels / forms ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 24px; margin-bottom: 18px;
  }
  .panel h2 { font-size: 18px; margin-bottom: 16px; }
  .input-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-bottom: 18px; align-items: start; }
  label { display: block; font-size: 13.5px; font-weight: 500; color: var(--ink); margin-bottom: 7px; }
  .field-help { font-size: 12.5px; color: var(--ink-muted); margin-top: 5px; }
  textarea, input[type="number"], input[type="text"], select {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; background: var(--bg); color: var(--ink);
  }
  textarea { resize: vertical; min-height: 130px; line-height: 1.5; }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  .panel-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .sample-links { font-size: 13px; color: var(--ink-muted); }
  .sample-links button { background: none; border: none; color: var(--accent); font-size: 13px; text-decoration: underline; padding: 0; }
  .extract-summary {
    margin-top: 14px; padding: 12px 14px; background: var(--accent-soft); border-radius: var(--radius-sm);
    font-size: 13.5px; color: var(--ink);
  }
  .rate-row { display: flex; gap: 8px; align-items: center; }
  .rate-row select { flex: 0 0 84px; }
  .rate-row input { flex: 1; }
  .rate-row span { font-size: 14px; color: var(--ink-muted); white-space: nowrap; }

  .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .field { display: flex; flex-direction: column; }
  .deadline-pair { display: flex; gap: 8px; }
  .deadline-pair select { flex: 0 0 90px; }

  .toggle-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .toggle-chip {
    display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 11px 13px; font-size: 14px; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .toggle-chip input { width: 16px; height: 16px; accent-color: var(--accent); }
  .toggle-chip.checked { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- results: decision hero ---------- */
  .decision-hero {
    border-radius: var(--radius-lg); padding: 30px 28px; margin-bottom: 18px;
    border: 1px solid var(--border);
  }
  .decision-hero.level-low { background: var(--risk-low-bg); border-color: color-mix(in srgb, var(--risk-low) 35%, var(--border)); }
  .decision-hero.level-medium { background: var(--risk-medium-bg); border-color: color-mix(in srgb, var(--risk-medium) 35%, var(--border)); }
  .decision-hero.level-high { background: var(--risk-high-bg); border-color: color-mix(in srgb, var(--risk-high) 35%, var(--border)); }
  .decision-eyebrow { font-size: 13px; color: var(--ink-muted); margin-bottom: 6px; }
  .decision-badge { font-family: var(--font-display); font-size: clamp(28px, 5vw, 38px); font-weight: 700; }
  .level-low .decision-badge { color: var(--risk-low); }
  .level-medium .decision-badge { color: var(--risk-medium); }
  .level-high .decision-badge { color: var(--risk-high); }
  .decision-reason { margin-top: 12px; font-size: 15.5px; max-width: 62ch; color: var(--ink); }

  /* ---------- workload panel ---------- */
  .workload-list { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .workload-row { display: flex; align-items: center; justify-content: space-between; font-size: 14.5px; padding: 4px 0; }
  .workload-row .wl-label { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .workload-row .wl-value { font-family: var(--font-mono); font-weight: 600; }
  .workload-row.total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 12px; font-weight: 600; }
  .why-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--ink-muted); padding-left: 4px; }
  .why-list li { padding-left: 14px; position: relative; }
  .why-list li::before { content: '—'; position: absolute; left: 0; color: var(--border); }

  /* ---------- financial cards ---------- */
  .financial-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .fin-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; }
  .fin-card .fin-label { font-size: 12.5px; color: var(--ink-muted); margin-bottom: 8px; }
  .fin-card .fin-value { font-family: var(--font-mono); font-size: 21px; font-weight: 600; }
  .fin-card.highlight { border-color: var(--accent); }

  /* ---------- ask list ---------- */
  .ask-list { display: flex; flex-direction: column; gap: 9px; }
  .ask-list li { display: flex; gap: 10px; font-size: 14.5px; align-items: flex-start; }
  .ask-list li::before { content: '•'; color: var(--accent); font-weight: 700; line-height: 1.5; }

  /* ---------- risk grid ---------- */
  .risk-grid { display: flex; flex-direction: column; gap: 10px; }
  .risk-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 15px; }
  .risk-row-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .risk-name { font-size: 14.5px; font-weight: 500; }
  .risk-badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 100px; }
  .risk-badge.low { color: var(--risk-low); background: var(--risk-low-bg); }
  .risk-badge.medium { color: var(--risk-medium); background: var(--risk-medium-bg); }
  .risk-badge.high { color: var(--risk-high); background: var(--risk-high-bg); }
  .risk-explain { margin-top: 6px; font-size: 13.5px; color: var(--ink-muted); }

  /* ---------- negotiation / message ---------- */
  .negotiate-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 4px; }
  .negotiate-list li { display: flex; gap: 10px; font-size: 14.5px; }
  .negotiate-list li::before { content: '→'; color: var(--accent); }
  #client-message { min-height: 170px; font-size: 14.5px; line-height: 1.55; margin-bottom: 12px; }
  .copy-row { display: flex; align-items: center; gap: 12px; }
  .copy-note { font-size: 13px; color: var(--risk-low); opacity: 0; transition: opacity 0.2s ease; }
  .copy-note.show { opacity: 1; }

  .disclaimer { font-size: 12.5px; color: var(--ink-muted); margin: 20px 0 0; max-width: 68ch; }
  .results-footer { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }

  .restore-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--accent-soft); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 16px; margin-bottom: 18px; font-size: 13.5px; flex-wrap: wrap;
  }
  .restore-banner .actions { display: flex; gap: 14px; }
  .restore-banner button { background: none; border: none; color: var(--accent); font-weight: 500; padding: 0; font-size: 13.5px; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; padding-top: 20px; }
    .steps { grid-template-columns: 1fr; gap: 22px; }
    .input-grid { grid-template-columns: 1fr; }
    .field-grid { grid-template-columns: 1fr 1fr; }
    .toggle-grid { grid-template-columns: 1fr; }
    .financial-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 460px) {
    .field-grid { grid-template-columns: 1fr; }
    .financial-grid { grid-template-columns: 1fr; }
  }

  /* ---------- verdict score, reasons, confidence ---------- */
  .decision-headline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .decision-score {
    font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: var(--ink-muted);
    border: 1px solid var(--border); border-radius: 100px; padding: 2px 12px; background: var(--surface);
  }
  .verdict-why { margin-top: 18px; }
  .verdict-why h3 { font-size: 14px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }
  .reason-list { display: flex; flex-direction: column; gap: 8px; counter-reset: reason; }
  .reason-list li {
    font-size: 14.5px; padding-left: 26px; position: relative; max-width: 68ch;
  }
  .reason-list li::before {
    counter-increment: reason; content: counter(reason);
    position: absolute; left: 0; top: 1px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-muted);
  }
  .reason-list li.reason-positive::before { color: var(--risk-low); border-color: var(--risk-low); }
  .reason-list li.reason-blocker::before, .reason-list li.reason-cap::before { color: var(--risk-high); border-color: var(--risk-high); }
  .cap-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .cap-list li {
    font-size: 13.5px; color: var(--risk-high); background: var(--risk-high-bg);
    border-radius: var(--radius-sm); padding: 9px 12px; max-width: 68ch;
  }
  .confidence-row { margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .conf-note { font-size: 13px; color: var(--ink-muted); }
  .conf-badge {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 100px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted); white-space: nowrap;
  }
  .conf-badge.conf-high { color: var(--risk-low); background: var(--risk-low-bg); border-color: transparent; }
  .conf-badge.conf-medium { color: var(--risk-medium); background: var(--risk-medium-bg); border-color: transparent; }
  .conf-badge.conf-low { color: var(--risk-high); background: var(--risk-high-bg); border-color: transparent; }

  /* ---------- score breakdown ---------- */
  .panel-intro { font-size: 13.5px; color: var(--ink-muted); margin-bottom: 16px; margin-top: -8px; }
  .score-breakdown { display: flex; flex-direction: column; gap: 14px; }
  .score-row-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; margin-bottom: 6px; gap: 10px; }
  .score-weight { font-size: 12px; color: var(--ink-muted); }
  .score-value { font-family: var(--font-mono); font-weight: 600; }
  .score-bar { height: 8px; border-radius: 100px; background: var(--surface-2); overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 100px; transition: width 0.8s cubic-bezier(.2,.7,.2,1); }
  .score-bar-fill.good { background: var(--risk-low); }
  .score-bar-fill.mid { background: var(--risk-medium); }
  .score-bar-fill.bad { background: var(--risk-high); }
  .risk-axis { margin-top: 6px; font-size: 12px; color: var(--ink-muted); font-family: var(--font-mono); }
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark">Job Analyzer<span class="dot">.</span></div>
  <div class="tag">for video editors</div>
</div>

<div class="shell">

  <!-- ============================= HOME VIEW ============================= -->
  <section class="view active" id="view-home">
    <div class="hero">
      <div class="hero-text">
        <h1>Know what a video editing job is really worth.</h1>
        <p class="hero-sub">Paste a client's job description and get a workload estimate, an effective hourly rate, a risk breakdown, and a negotiation strategy — before you say yes.</p>
        <div class="hero-actions">
          <button class="btn btn-primary btn-cta" id="btn-start">Analyze a job</button>
          <button class="btn btn-ghost" id="btn-how">See how it works</button>
        </div>
      </div>
      <div class="hero-visual">
        <div class="timeline-demo">
          <div class="timeline-demo-label">Where a "$300, 48-hour" job actually goes</div>
          <div class="timeline-track" id="demo-track">
            <div class="seg seg-editing" data-target="64" id="demo-editing">Editing</div>
            <div class="seg seg-revisions" data-target="11" id="demo-revisions"></div>
            <div class="seg seg-
